---
layout: default
---

<article class="entry">
  <header class="entry-header">
    <span class="entry-format-badge">{{ page.format }}</span>
    <h1>{{ page.title }}</h1>
    <div class="entry-meta">
      <span class="entry-meta-author">{{ page.author }}</span>
      {% if page.year %}<span class="entry-meta-year">{{ page.year }}</span>{% endif %}
      <span class="entry-meta-topic"><a href="{{ '/topics/' | append: page.topic | append: '/' | relative_url }}">{{ page.topic | replace: '-', ' ' | capitalize }}</a></span>
      {% if page.source %}
        <span class="entry-meta-source"><a href="{{ page.source }}" target="_blank" rel="noopener">Original &rarr;</a></span>
      {% endif %}
    </div>
  </header>

  <hr class="entry-divider">

  <div class="entry-content">
    {{ content }}
  </div>

  <footer class="entry-footer">
    <a href="{{ '/' | relative_url }}">&larr; Back to all entries</a>
  </footer>
</article>
