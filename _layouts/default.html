<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% seo %}
</head>
<body>
  <header class="site-header">
    <div class="header-accent-line"></div>
    <div class="wrapper">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/formats/papers/' | relative_url }}">Papers</a>
        <a href="{{ '/formats/books/' | relative_url }}">Books</a>
        <a href="{{ '/formats/blogs/' | relative_url }}">Blogs</a>
        <a href="{{ '/formats/rfcs/' | relative_url }}">RFCs</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
      </nav>
    </div>
  </header>

  <div class="page-surface">
    <main class="page-content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>
  </div>

  <footer class="site-footer">
    <div class="wrapper">
      <p>A reading archive by Nicolas De Giacomo</p>
    </div>
  </footer>
</body>
</html>
